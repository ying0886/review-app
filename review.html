<style>
  *{box-sizing:border-box}
  :root{
    --bg:#F7F5F0;
    --ink:#2B2B2B;
    --ink2:#5A554C;
    --line:#DDD8CC;
    --line2:#C9C3B4;
    --card:#FFFDF8;
    --accent:#33604F;
    --accentBg:#E6EEE8;
    --lvA:#33604F;
    --lvB:#3A5570;
    --lvC:#7A5C3A;
    --chip:#EFEAE0;
    --chipOn:#E6EEE8;
    --chipOnInk:#2A4F42;
    --barBg:#E4DFD3;
  }
  html[data-theme="dark"]{
    --bg:#1A1A1A;
    --ink:#E8E6E1;
    --ink2:#A8A49B;
    --line:#33312D;
    --line2:#3F3C36;
    --card:#211F1D;
    --accent:#8FBFA6;
    --accentBg:#24332C;
    --lvA:#8FBFA6;
    --lvB:#93B0CC;
    --lvC:#C9A87C;
    --chip:#26241F;
    --chipOn:#24332C;
    --chipOnInk:#A8D4BD;
    --barBg:#33312D;
  }
  @media (prefers-color-scheme:dark){
    html:not([data-theme="light"]){
      --bg:#1A1A1A;
      --ink:#E8E6E1;
      --ink2:#A8A49B;
      --line:#33312D;
      --line2:#3F3C36;
      --card:#211F1D;
      --accent:#8FBFA6;
      --accentBg:#24332C;
      --lvA:#8FBFA6;
      --lvB:#93B0CC;
      --lvC:#C9A87C;
      --chip:#26241F;
      --chipOn:#24332C;
      --chipOnInk:#A8D4BD;
      --barBg:#33312D;
    }
  }
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;
    line-height:1.6;
    letter-spacing:0;
  }

  /* ---------- 顶部固定栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:10px 16px calc(10px);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .topbar h1{
    margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;
    color:var(--ink);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;position:relative}
  .scope{
    font-size:11.5px;color:var(--ink2);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;
  }
  .subjects{display:flex;align-items:center;gap:2px;overflow-x:auto;max-width:44vw;scrollbar-width:none}
  .subjects::-webkit-scrollbar{display:none}
  .tab{
    appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--ink2);font:inherit;font-size:13.5px;
    padding:6px 8px;min-height:32px;cursor:pointer;white-space:nowrap;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .prog{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
  .progText{font-size:13px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bar{flex:1 1 80px;height:3px;background:var(--barBg);border-radius:2px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .25s ease}
  .acts{display:flex;gap:8px;margin-left:auto}
  .btn{
    min-height:44px;min-width:44px;padding:0 14px;
    background:transparent;color:var(--ink);
    border:1px solid var(--line2);border-radius:6px;
    font:inherit;font-size:14px;cursor:pointer;
  }
  .btn:hover{background:var(--chip)}
  .btn[aria-expanded="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--accent)}
  .btn.small{min-height:38px;padding:0 10px;font-size:12.5px;color:var(--ink2)}
  .btn:focus-visible,.chip:focus-visible,summary:focus-visible,.ovrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* 科目概览浮层 */
  .ovpanel{
    position:absolute;top:calc(100% + 8px);left:0;z-index:25;
    min-width:220px;max-width:min(340px,calc(100vw - 32px));
    background:var(--card);border:1px solid var(--line2);border-radius:6px;
    box-shadow:0 6px 20px rgba(0,0,0,.10);
    padding:6px;
  }
  .ovpanel p{margin:4px 8px 8px;font-size:11.5px;color:var(--ink2);letter-spacing:.04em}
  .ovrow{
    display:flex;align-items:center;gap:12px;width:100%;
    background:transparent;border:0;border-radius:4px;
    padding:9px 8px;min-height:40px;
    font:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer;
  }
  .ovrow:hover{background:var(--chip)}
  .ovrow[aria-current="true"]{color:var(--accent);font-weight:600}
  .ovrow span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}

  /* 数据异常提示 */
  .notice{
    padding:8px 16px;font-size:13px;color:var(--ink2);
    background:var(--chip);border-bottom:1px solid var(--line);
  }

  /* ---------- 容器 ---------- */
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 56px}
  .printhead{display:none}

  /* ---------- 筛选 ---------- */
  .filters{
    display:flex;flex-direction:column;gap:8px;
    padding-bottom:14px;margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .facet{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .flabel{font-size:12px;color:var(--ink2);width:52px;flex:0 0 auto;letter-spacing:.02em}
  .chip{
    min-height:44px;padding:0 14px;
    background:transparent;color:var(--ink2);
    border:1px solid var(--line2);border-radius:6px;
    font:inherit;font-size:13.5px;cursor:pointer;
    display:inline-flex;align-items:center;
  }
  .chip:hover{background:var(--chip)}
  .chip[aria-pressed="true"]{
    background:var(--chipOn);color:var(--chipOnInk);
    border-color:var(--accent);font-weight:600;
  }

  /* ---------- 级别分组 ---------- */
  .grp{margin:22px 0 0;border-top:1px solid var(--line);padding-top:10px}
  .grp>summary{
    display:flex;align-items:center;gap:10px;
    min-height:48px;cursor:pointer;list-style:none;
  }
  .grp>summary::-webkit-details-marker{display:none}
  .gbar{width:3px;height:20px;border-radius:2px;background:var(--accent)}
  .grp[data-level="B"] .gbar{background:var(--lvB)}
  .grp[data-level="C"] .gbar{background:var(--lvC)}
  .gtitle{font-size:14px;font-weight:600;letter-spacing:.02em}
  .gcount{font-size:13px;color:var(--ink2);margin-left:auto;font-variant-numeric:tabular-nums}
  .caret{transition:transform .18s ease;color:var(--ink2);font-size:12px}
  .grp[open]>summary .caret{transform:rotate(90deg)}

  /* ---------- 知识点卡片 ---------- */
  .card{
    border-left:3px solid var(--accent);
    border-radius:0 4px 4px 0;
    background:var(--card);
    margin:8px 0;
    padding:0 14px;
  }
  .card[data-level="A"]{border-left-color:var(--lvA)}
  .card[data-level="B"]{border-left-color:var(--lvB)}
  .card[data-level="C"]{border-left-color:var(--lvC)}
  .card>summary{
    list-style:none;cursor:pointer;
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
    min-height:52px;padding:10px 0;
  }
  .card>summary::-webkit-details-marker{display:none}
  .no{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .nm{font-size:15.5px;font-weight:600;flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
  .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .badge{
    font-size:11.5px;line-height:1.5;padding:1px 6px;
    border:1px solid currentColor;border-radius:3px;
    white-space:nowrap;letter-spacing:.02em;
  }
  .badge.lv{font-weight:700}
  .card[data-level="A"] .badge.lv{color:var(--lvA)}
  .card[data-level="B"] .badge.lv{color:var(--lvB)}
  .card[data-level="C"] .badge.lv{color:var(--lvC)}
  .badge.src{color:var(--ink2)}
  .badge.sec{color:var(--ink2);font-variant-numeric:tabular-nums}
  .badge.refs{color:var(--ink2);opacity:.75}
  .badge.none{color:var(--ink2);opacity:.55;border-style:dashed}
  .badge.sig{
    color:var(--ink2);background:var(--chip);border-color:var(--line2);
    cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  .badge.sig:hover{color:var(--accent);border-color:var(--accent)}
  .card.sigfocus>summary{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:4px}
  .form{
    font-size:11.5px;line-height:1.5;padding:1px 6px;
    background:var(--chip);color:var(--ink2);border-radius:3px;white-space:nowrap;
  }

  /* 勾选 */
  .mwrap{flex:0 0 auto;margin-left:auto;display:flex;align-items:center}
  .mwrap label{
    display:flex;align-items:center;gap:7px;
    min-height:44px;padding:0 2px;
    font-size:13px;color:var(--ink2);cursor:pointer;user-select:none;
  }
  .mwrap input{position:absolute;opacity:0;width:1px;height:1px}
  .mbox{
    width:18px;height:18px;border:1.5px solid var(--line2);border-radius:3px;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:transparent;
  }
  .mbox::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);opacity:0}
  .mwrap input:checked+.mbox{background:var(--accent);border-color:var(--accent)}
  .mwrap input:checked+.mbox::after{opacity:1}
  .mwrap input:focus-visible+.mbox{outline:2px solid var(--accent);outline-offset:2px}
  .mwrap input:checked~.mtext{color:var(--accent);font-weight:600}

  /* 已掌握样式（不隐藏，只降噪） */
  .card.done .nm{color:var(--ink2);font-weight:500}
  .card.done{opacity:.72}

  /* 展开内容 */
  .body{padding:2px 0 14px;border-top:1px solid var(--line);margin-top:2px}
  .field{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:0}
  .k{
    flex:0 0 84px;font-size:12px;color:var(--ink2);
    letter-spacing:.03em;padding-top:1px;
  }
  .field p{margin:0;font-size:14.5px;line-height:1.7;min-width:0;overflow-wrap:anywhere}
  .field p.warn{color:var(--ink)}
  .ref{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
  .low{font-size:12px;color:var(--ink2);border-left:2px solid var(--line2);padding-left:8px;display:inline-block}

  /* ---------- 解题方法 / 知识网络（新增字段渲染） ---------- */
  .mthbox,.netbox{flex:1 1 auto;min-width:0}
  .mth{border-left:2px solid var(--line2);padding:0 0 0 10px;margin:0 0 12px}
  .mth:last-child{margin-bottom:0}
  .mthhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
  .mthno{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .mthname{font-size:14px;font-weight:600}
  .mthsteps{margin:2px 0 3px;padding-left:1.15em;font-size:14px;line-height:1.7}
  .mthsteps li{margin:1px 0;overflow-wrap:anywhere}
  .mthwhen{font-size:12.5px;line-height:1.6;color:var(--ink2);margin:2px 0 0}
  .netline{display:flex;flex-wrap:wrap;gap:4px;align-items:baseline;font-size:14px;line-height:1.75;margin:0 0 3px}
  .netline:last-child{margin-bottom:0}
  .netlab{flex:0 0 auto;font-size:12px;color:var(--ink2);letter-spacing:.03em}

  /* ---------- 例题 ---------- */
  .examples{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2)}
  .ex{margin:0 0 12px}
  .ex:last-child{margin-bottom:0}
  .exhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .exlabel{font-size:12px;color:var(--ink2);letter-spacing:.03em}
  .excount{font-size:12px;color:var(--ink2)}
  .extype{
    font-size:11.5px;line-height:1.5;padding:1px 6px;
    border:1px solid var(--line2);border-radius:3px;color:var(--ink2);white-space:nowrap;
  }
  .exno{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .exq{margin:0 0 6px;font-size:14.5px;line-height:1.75;overflow-wrap:anywhere}
  .exsol{margin:0}
  .exsol>summary{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:var(--accent);cursor:pointer;user-select:none;
    list-style:none;padding:2px 0;
  }
  .exsol>summary::-webkit-details-marker{display:none}
  .exsol>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .caret2{font-size:11px;display:inline-block;transition:transform .18s ease}
  .exsol[open]>summary .caret2{transform:rotate(90deg)}
  .sol{
    margin-top:6px;padding-left:10px;border-left:2px solid var(--line2);
    font-size:14px;line-height:1.75;color:var(--ink);overflow-wrap:anywhere;
  }
  .sol p{margin:0 0 6px}
  .sol p:last-child{margin-bottom:0}
  .sol b{font-weight:600}

  /* ---------- 底部统计 ---------- */
  .stats{
    margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:6px 22px;
    font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums;
  }
  .stats b{color:var(--ink);font-weight:600}
  .stats .ver{font-size:12px;color:var(--ink2);opacity:.85;margin-left:auto}

  /* ---------- 提示 ---------- */
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);
    font-size:13.5px;padding:10px 16px;border-radius:6px;
    opacity:0;transition:opacity .35s ease;pointer-events:none;z-index:30;
    max-width:calc(100vw - 32px);
  }
  .toast.show{opacity:.94}
  .toast.out{opacity:0}

  .hide{display:none !important}
  .empty{padding:24px 0;color:var(--ink2);font-size:14px}

  /* ---------- 收藏 ---------- */
  .favbtn{
    margin-left:auto;align-self:center;flex:0 0 auto;
    width:32px;height:32px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid transparent;border-radius:6px;
    color:var(--ink2);font-size:17px;line-height:1;cursor:pointer;
    transition:color .15s ease,background .15s ease,border-color .15s ease;
  }
  .favbtn:hover{background:var(--accentBg);border-color:var(--line2);color:var(--accent)}
  .favbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .favbtn .staron{display:none}
  .favbtn[aria-pressed="true"]{color:var(--accent)}
  .favbtn[aria-pressed="true"] .staroff{display:none}
  .favbtn[aria-pressed="true"] .staron{display:inline}
  .favcount{
    display:inline-block;min-width:17px;margin-left:5px;padding:0 4px;
    font-size:11px;line-height:15px;border-radius:8px;text-align:center;
    background:var(--chip);color:var(--accent);font-variant-numeric:tabular-nums;
  }
  .favcount[hidden]{display:none}

  .drawerScrim{position:fixed;inset:0;z-index:40;background:rgba(12,14,18,.44)}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;z-index:41;
    width:min(440px,100vw);display:flex;flex-direction:column;
    background:var(--card);color:var(--ink);
    border-left:1px solid var(--line2);
    box-shadow:-24px 0 52px rgba(0,0,0,.26);
  }
  .drawer[hidden],.drawerScrim[hidden]{display:none !important}
  .drawerHead{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid var(--line);
  }
  .drawerHead h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
  .drawerHint{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .drawerHead .btn{flex:0 0 auto}
  .drawerBody{flex:1 1 auto;overflow-y:auto;padding:12px 14px 30px;overscroll-behavior:contain}
  .favitem{
    margin:0 0 10px;padding:10px 12px;border:1px solid var(--line2);border-radius:7px;
    background:var(--bg);
  }
  .favitem:last-child{margin-bottom:0}
  .favkp{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--ink2)}
  .favkp .fid{color:var(--accent);font-variant-numeric:tabular-nums}
  .favkp .fname{flex:1 1 100%;color:var(--ink);font-size:12.5px;line-height:1.5}
  .favq{margin:6px 0 4px;font-size:13.5px;line-height:1.7;overflow-wrap:anywhere}
  .favacts{display:flex;align-items:center;gap:16px;margin-top:4px}
  .favacts button{
    background:none;border:0;padding:8px 0;min-height:32px;
    font-size:12.5px;cursor:pointer;
  }
  .favgo{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .favdel{color:var(--ink2);margin-left:auto}
  .favdel:hover{color:var(--ink)}
  .favempty{padding:24px 2px;color:var(--ink2);font-size:13.5px;line-height:1.85}
  body.drawerOpen{overflow:hidden}

  /* [sync] 同步按钮圆点与设置面板 */
  .dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;vertical-align:1px;background:#9aa0a6}
  .dot.busy{background:#e8a13a;animation:syncpulse 1s ease-in-out infinite}
  .dot.ok{background:#33a852}
  .dot.err{background:#d9453d}
  .dot.dirty{background:#3b82f6}
  @keyframes syncpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .sfield{margin:0 0 10px}
  .sfield>label{display:block;margin-bottom:4px;font-size:12px;color:var(--ink2)}
  .sfield>input,.sfield>select{
    width:100%;box-sizing:border-box;padding:7px 9px;font:inherit;font-size:13px;
    color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:6px;
  }
  .srow{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
  .srow .btn{flex:0 0 auto}
  .sstat{margin:0 0 12px;padding:9px 11px;border:1px solid var(--line2);border-radius:7px;background:var(--bg);font-size:12.5px;line-height:1.8;color:var(--ink2);overflow-wrap:anywhere}
  .sstat b{color:var(--ink);font-weight:600}
  .snote{margin:0 0 12px;font-size:12px;line-height:1.8;color:var(--ink2)}
  .snote.warn{color:#b3541e}
  .sline{margin:0}

  /* KaTeX 与正文的对齐 */
  .katex{font-size:1.07em}
  .katex-display{margin:.6em 0 .65em;text-align:center}
  .katex-display>.katex{font-size:1.12em}
  .field p .katex-display{margin:.5em 0 .55em}
  .field p .katex-display>.katex{font-size:1.06em}
  .sol .katex-display{margin:.5em 0 .55em}
  .sol .katex-display>.katex{font-size:1.02em}
  .sol p{margin:.35em 0}
  .exq{overflow-x:auto}
  .exq .katex{font-size:1.06em}
  .katex-display{overflow-x:auto;overflow-y:hidden;padding:1px 0}

  /* ---------- 打印 ---------- */
  @media print{
    @page{
      size:A4;
      margin:16mm 14mm 18mm;
      @bottom-center{
        content:"第 " counter(page) " 页 / 共 " counter(pages) " 页";
        font:400 9pt/1 -apple-system,"Segoe UI",system-ui,sans-serif;
        color:#666;
      }
    }
    html,body{background:#fff !important;color:#000 !important}
    .topbar,.filters,.toast,.acts,.subjects,.ovpanel,.notice,.scope{display:none !important}
    .wrap{max-width:none;padding:0}
    .printhead{
      display:block !important;
      margin:0 0 14px;padding-bottom:6px;
      border-bottom:1px solid #999;
      font-size:13px;color:#333 !important;
    }
    .printhead b{font-size:15px;color:#000 !important}
    .grp{border-top:1px solid #bbb;margin-top:14px}
    .card{
      background:#fff !important;border:1px solid #bbb;border-left:3px solid #444;
      box-shadow:none !important;break-inside:avoid;page-break-inside:avoid;
      margin:6px 0;padding:0 10px;
    }
    .grp>summary,.card>summary{background:#fff !important;min-height:0;padding:6px 0}
    .body{padding-bottom:10px}
    .badge,.form{background:#fff !important;color:#000 !important;border:1px solid #888}
    .badge.lv,.card[data-level] .badge.lv{color:#000 !important}
    .k,.no,.gcount,.nm{color:#000 !important}
    .ref{color:#000;text-decoration:none}
    .bar{background:#ddd !important}
    .bar>i{background:#444 !important}
    .card.done{opacity:1 !important}
    .stats{color:#000}
    .caret{display:none}
    .caret2{display:none}
    .examples{border-top:1px solid #ddd}
    .extype{border-color:#888;color:#000 !important;background:#fff !important}
    .exsol>summary{color:#000 !important}
    .sol{border-left-color:#bbb;color:#000}
    .stats .ver{color:#000;opacity:1}
    .drawer,.drawerScrim,.favbtn,.favcount{display:none !important}
    .ex,.sol{break-inside:avoid;page-break-inside:avoid}
    .katex{font-size:1em;break-inside:avoid}
    .badge.sig{background:#fff !important;border:1px solid #888;white-space:normal;overflow:visible;text-overflow:clip}
    .mth,.netline,.mthsteps li{break-inside:avoid;page-break-inside:avoid}
    .mth{border-left-color:#bbb}
    .mthno,.mthwhen,.netlab{color:#000 !important}
    .card.sigfocus>summary{outline:0}
  }
  @media (max-width:560px){
    .flabel{width:100%}
    .nm{flex:1 1 100%}
    .tags{order:3}
    .mwrap{order:2}
    .scope{display:none}
    .subjects{max-width:calc(100% - 165px);flex:1 1 auto}
    .topbar{gap:10px}
    .topbar h1,.btn{white-space:nowrap}
    .acts{gap:6px}
    .acts .btn{padding:0 10px}
  }
  /* ---------- 手机横屏自适应（纯 CSS，不改结构/数据；screen 限定保证打印不受影响） ---------- */
  @media screen and (orientation: landscape) and (max-height: 540px){
    /* 容器：撑满全宽，右侧不留白 */
    .wrap{max-width:none !important;width:100%;padding:10px 8px 24px}
    #groups{width:100%}

    /* 顶部栏：压缩成一行，高度尽量 <= 48px */
    .topbar{padding:5px 12px;gap:4px 12px}
    .topbar h1{font-size:13.5px;white-space:nowrap}
    .scope{display:none}
    .subjects{max-width:none;flex:0 1 auto;min-width:0}
    .tab{font-size:12px;padding:4px 6px;min-height:28px}
    .prog{flex:1 1 110px;gap:8px}
    .progText{font-size:11.5px}
    .bar{min-width:44px}
    .acts{gap:5px;margin-left:0}
    .btn{min-height:32px;min-width:32px;padding:0 9px;font-size:12.5px}
    .btn.small{min-height:28px;padding:0 7px;font-size:11.5px}

    /* 筛选：三层 facet 横排并允许换行 */
    .filters{flex-direction:row;flex-wrap:wrap;gap:6px 16px;padding-bottom:8px;margin-bottom:4px}
    .facet{gap:4px 6px}
    .flabel{width:auto;font-size:11.5px;flex:0 0 auto}
    .chip{min-height:32px;padding:0 10px;font-size:12.5px}

    /* 级别分组收紧 */
    .grp{margin-top:12px;padding-top:8px}
    .grp>summary{min-height:38px}

    /* 卡片头部：编号 + 名称 + 标签 + 勾选 同一行 */
    .card{padding:0 12px;margin:6px 0;width:100%}
    .card>summary{flex-wrap:nowrap;min-height:40px;padding:6px 0;gap:4px 8px}
    .nm{flex:1 1 auto;min-width:0;font-size:14.5px}
    .tags{flex:0 1 auto;flex-wrap:nowrap;min-width:0;overflow:hidden;gap:4px}
    .badge{font-size:10.5px;padding:1px 4px}
    .form{font-size:10.5px;padding:1px 4px}
    .mwrap label{min-height:36px;font-size:12px;gap:5px}
    .mbox{width:16px;height:16px}

    /* 展开内容：两列网格，例题独占整行 */
    .card .body{
      display:grid;grid-template-columns:repeat(2,1fr);column-gap:24px;
      row-gap:0;padding:2px 0 10px;width:100%;
    }
    .card .body>.field{min-width:0;width:100%}
    .card .body>.field:last-child{border-bottom:0}
    .card .body>.examples{grid-column:1 / -1;width:100%}
    .k{flex:0 0 84px}
    .field p{font-size:14.5px}
    .examples{margin-top:8px}
    /* 例题与解答：整行变宽后略收字号，避免单行过长 */
    .exq,.sol{font-size:14px}
  }
  /* ---------- [update] 应用更新横幅与设置块（2.5.0 新增） ---------- */
  .updatebar{
    position:relative;z-index:19;
    display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;
    padding:9px 16px;
    background:var(--accentBg);color:var(--ink);
    border-bottom:1px solid var(--line2);
    font-size:13.5px;line-height:1.55;
  }
  .updatebar[hidden]{display:none !important}
  .ubtext{flex:1 1 260px;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
  .ubver{font-weight:600;color:var(--accent);white-space:nowrap;letter-spacing:.01em}
  .ubnotes{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ubacts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
  .ubacts .btn{background:var(--card)}
  .ubacts .btn:hover{background:var(--chip)}
  .ubacts .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
  .ubacts .btn.primary:hover{background:var(--accent);opacity:.92}
  .supd{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
  .supdTitle{margin:0 0 8px;font-size:13.5px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
  .supdCheck{
    display:flex;align-items:center;gap:8px;
    min-height:40px;margin:0 0 8px;font-size:13px;color:var(--ink);
    cursor:pointer;user-select:none;
  }
  .supdCheck input{width:17px;height:17px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
  .supdJson{
    margin:0 0 12px;padding:8px 10px;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:11.5px;line-height:1.7;
    color:var(--ink2);background:var(--bg);
    border:1px solid var(--line);border-radius:6px;
    word-break:break-all;overflow-wrap:anywhere;
  }
  @media print{ .updatebar{display:none !important} }
  @media (max-width:560px){
    .updatebar{padding:8px 12px;gap:6px;align-items:flex-start}
    .ubtext{flex:1 1 100%}
    .ubnotes{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .ubacts{margin-left:0;width:100%;gap:6px}
    .ubacts .btn{flex:1 1 auto;padding:0 10px}
  }
  @media screen and (orientation:landscape) and (max-height:540px){
    .updatebar{padding:4px 12px;gap:4px 10px;font-size:12px}
    .ubtext{flex:1 1 200px}
    .ubnotes{white-space:nowrap;display:block;-webkit-line-clamp:unset}
    .ubacts{gap:5px}
    .ubacts .btn{min-height:30px;padding:0 9px;font-size:12px}
    .supdCheck{min-height:32px;font-size:12.5px;margin-bottom:6px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1 id="subject">知识点复习</h1>
    <span class="scope" id="scope" hidden></span>
    <nav class="subjects" id="subjects" aria-label="科目切换" hidden></nav>
    <button class="btn small" id="ovBtn" type="button" aria-expanded="false" aria-controls="ovPanel" hidden>全部科目概览</button>
    <div class="ovpanel" id="ovPanel" hidden>
      <p>已掌握 / 总数</p>
      <div id="ovList"></div>
    </div>
  </div>
  <div class="prog">
    <span class="progText" id="progText">已完成 0 / 0</span>
    <span class="bar"><i id="progBar"></i></span>

  <div class="acts">
    <button class="btn" id="favBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="favDrawer" title="我的收藏 · 当前科目">我的收藏<span class="favcount" id="favCount" hidden>0</span></button>
    <button class="btn" id="themeBtn" type="button">深色</button>
    <button class="btn" id="printBtn" type="button">打印</button>
    <button class="btn" id="syncBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="syncDrawer" title="多端进度同步"><span class="dot" id="syncDot"></span>同步</button>
  </div>
</header>

<div class="updatebar" id="updatebar" role="region" aria-label="应用更新" hidden>
  <div class="ubtext">
    <span class="ubver" id="ubVer">发现新版本</span>
    <span class="ubnotes" id="ubNotes"></span>
  </div>
  <div class="ubacts">
    <button class="btn small primary" id="ubGo" type="button">立即更新</button>
    <button class="btn small" id="ubLater" type="button">稍后</button>
    <button class="btn small" id="ubIgnore" type="button">忽略此版本</button>

</div>

<div class="notice" id="notice" hidden>科目数据格式已升级，请让 Harness 重新生成</div>

<div class="wrap">
  <div class="printhead" id="printHead"></div>
  <div class="filters" id="filters"></div>
  <main id="groups"></main>
  <footer class="stats" id="stats"></footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">点卡片展开，勾选即记录掌握</div>

<div class="drawerScrim" id="favScrim" hidden></div>
<aside class="drawer" id="favDrawer" role="dialog" aria-modal="true" aria-labelledby="favTitle" tabindex="-1" hidden>
  <div class="drawerHead">
    <h2 id="favTitle">我的收藏</h2>
    <span class="drawerHint" id="favHint"></span>
    <button class="btn small" id="favClose" type="button">关闭</button>
  </div>
  <div class="drawerBody" id="favBody"></div>
</aside>

<div class="drawerScrim" id="syncScrim" hidden></div>
<aside class="drawer" id="syncDrawer" role="dialog" aria-modal="true" aria-labelledby="syncTitle" tabindex="-1" hidden>
  <div class="drawerHead">
    <h2 id="syncTitle">多端同步</h2>
    <span class="drawerHint" id="syncHint">未配置</span>
    <button class="btn small" id="syncClose" type="button">关闭</button>
  </div>
  <div class="drawerBody" id="syncBody"></div>
</aside>

              "when": "含 sin x、ln(1+x) 等可等价因子时"
            },
            {
              "name": "洛必达三条件检查",
              "source": "武忠祥",
              "steps": [
                "必须是 0/0 或 ∞/∞ 型",
                "在去心邻域内可导且 g′≠0",
                "lim f′/g′ 存在或为无穷；不存在则洛必达失效，不能反推原极限不存在"
              ],
              "when": "每次用之前都要过一遍"
            },
            {
              "name": "暴力求导保底",
              "source": "框框（保底套路）",
              "steps": [
                "时间紧时直接连求两三次导",
                "每一步都检查是否已化成非未定式",
                "得到确定值就停手"
              ],
              "when": "考场上没思路时的保底路径"
            }
          ],
          "network": {
            "prerequisite": [
              "m1s5-02"
            ],
            "contrast": [
              "m2s8-02"
            ],
            "next": [
              "m2s8-02"
            ]
          },
          "examPattern": "计算题必考；选择题考「此处能否用洛必达」"
        },
        {
          "id": "m2s8-02",
          "section": "§2.8",
          "level": "B",
          "source": "已确认",
          "refs": "卷D3 Q15、卷D4 Q5",
          "name": "其他类型未定式与洛必达失效的情形",
          "forms": [
            "计算",
            "选择"
          ],
          "content": "其他未定式的转化：\\(0\\cdot\\infty\\) 型化为 \\(\\frac{0}{1/\\infty}\\) 或 \\(\\frac{\\infty}{1/0}\\)；\\(\\infty-\\infty\\) 型先通分或有理化；\\(1^{\\infty}\\)、\\(0^{0}\\)、\\(\\infty^{0}\\) 型取对数化为 \\(0\\cdot\\infty\\)。洛必达法则可能失效：若 \\(\\lim\\frac{f'}{g'}\\) 不存在（如振荡）但原极限存在，就不能用洛必达下结论；也可能出现循环求导，此时改用泰勒公式、等价无穷小或夹逼准则。",
          "trap": "①\\(0\\cdot\\infty\\) 直接写 0；②\\(1^{\\infty}\\) 直接写 1；③\\(\\infty-\\infty\\) 直接写 0；④洛必达循环或极限不存在时仍强行使用；⑤取对数后忘记把结果还原为指数形式。",
          "action": "①先识别未定式类型；②化成 \\(\\frac00\\) 或 \\(\\frac{\\infty}{\\infty}\\)；③验证洛必达条件，能算则算；④失效就换泰勒、等价无穷小、夹逼；⑤指数型取对数求极限后写回 \\(\\mathrm{e}^{\\lim}\\)。",
          "links": [
            "m2s8-01",
            "m1s4-01"
          ],
          "examples": [
            {
              "type": "选择",
              "q": "下列对洛必达法则的使用正确的是（　）<br>A. \\(\\lim_{x\\to\\infty}\\frac{x+\\sin x}{2x}=\\lim_{x\\to\\infty}\\frac{1+\\cos x}{2}\\)（故不存在）<br>B. \\(\\lim_{x\\to 0}\\frac{x+\\sin x}{x-\\sin x}=\\lim_{x\\to 0}\\frac{1+\\cos x}{1-\\cos x}=+\\infty\\)<br>C. \\(\\lim_{x\\to 0}\\frac{x^{2}\\sin\\frac{1}{x}}{\\sin x}=\\lim_{x\\to 0}\\frac{2x\\cdot\\sin\\frac{1}{x}-\\cos\\frac{1}{x}}{\\cos x}\\)<br>D. \\(\\lim_{x\\to\\infty}\\frac{\\sin x}{x}=\\lim_{x\\to\\infty}\\frac{\\cos x}{1}\\)（故不存在）",
              "a": "<p><b>答案：B</b></p><p>B 是 \\(0/0\\) 型且求导后极限为 \\(+\\infty\\)，属于「存在或为无穷」的允许情形。A、D 中原极限都存在（分别为 \\(1/2\\)、\\(0\\)），只是求导后的比值极限不存在——洛必达法则的结论是「若 \\(f'/g'\\) 有极限则原极限等于它」，反过来不成立。C 求导后越来越复杂，洛必达无效。</p><p>易错：把洛必达当成等价变形；它不是「一定成立」，而是有前提的充分条件。</p>"
            },
            {
              "type": "判断",
              "q": "若 \\(\\lim_{x\\to a}\\frac{f'(x)}{g'(x)}\\) 不存在，则 \\(\\lim_{x\\to a}\\frac{f(x)}{g(x)}\\) 一定不存在。（　）<br>A. 正确　B. 错误",
              "a": "<p><b>答案：B</b></p><p>反例：\\(\\lim_{x\\to\\infty}\\frac{\\sin x}{x}=0\\) 存在，但 \\(\\frac{\\cos x}{1}\\) 的极限不存在。洛必达失效只说明不能再用这条法则，原极限仍可能用别的方法求出。</p><p>易错：考场上洛必达一卡壳就判「极限不存在」，应先试试等价无穷小或夹逼。</p>"
            }
          ],
          "signal": "题干出现 0·∞、∞−∞、1^∞、0^0、∞^0，或洛必达求导后循环",
          "methods": [
            {
              "name": "五类未定式化归",
              "source": "武忠祥",
              "steps": [
                "0·∞ 化成分式：把一侧写成 1/另一侧",
                "∞−∞ 先通分或提公因子",
                "1^∞、0^0、∞^0 一律取对数化指数"
              ],
              "when": "凡非 0/0 与 ∞/∞ 的未定式"
            },
            {
              "name": "泰勒兜底法",
              "source": "武忠祥",
              "steps": [
                "确定分母最低阶",
                "将分子展开到同阶",
                "合并同阶项后取极限"
              ],
              "when": "洛必达循环、求导后更复杂、或含振荡因子时"
            },
            {
              "name": "先换元再判型",
              "source": "宋浩（待核实）",
              "steps": [
                "令 t=1/x 把 x→∞ 换成 t→0",
                "换元后重新判未定式类型",
                "能化简的先化简再动洛必达"
              ],
              "when": "含 1/x、根号套 1/x 的式子"
            }
          ],
          "network": {
            "prerequisite": [
              "m2s8-01"
            ],
            "contrast": [

            ],
            "next": []
          },
          "examPattern": "计算题必考压轴；洛必达失效的识别是选择题考点"
        }

      "defaultSubject": true
    }

<script>
(function () {
  "use strict";

  var APP_VERSION = "2.6.0";
  var DATA_VERSION = "2026-10-23";

  var LEVEL_ORDER = ["A", "B", "C"];
  var LEVEL_NAME = { A: "A 级 · 基础必守", B: "B 级 · 常考主力", C: "C 级 · 拔高覆盖" };
  var FORM_ORDER = ["选择", "判断", "填空", "简答", "计算", "论述"];
  var SOURCE_ORDER = ["已确认", "高频推断", "补充覆盖", "通用框架"];

  var LS_THEME = "review.theme.v1";
  var LS_HINT = "review.hint.v1";
  var LS_ACTIVE = "review-active-subject.v1";
  var LS_SEEN = "review-seen-subjects.v1";
  var LS_MIGRATED = "review-migrated.v2";
  var LS_LEGACY = "review.mastered.v1";
  var MKEY = "review-mastery:";

  function byId(id) { return document.getElementById(id); }
  function el(tag, cls) { var n = document.createElement(tag); if (cls) n.className = cls; return n; }
  function txt(tag, cls, s) { var n = el(tag, cls); n.textContent = s; return n; }

  /* 数据里的题目/解析允许少量行内标签（<br> <b> <p> 等），其余字符一律转义：
     数学公式里的 "0<x<2"、"a<b" 若直接 innerHTML 会被浏览器当成标签，把整段结构撑坏。 */
  var SAFE_TAG = /<\/?(?:br|b|p|span|em|strong|i|u|sub|sup|small|code)(?:\s+[a-z-]+(?:="[^"]*")?)*\s*\/?>/gi;
  function escText(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function safeHtml(s) {
    s = String(s == null ? "" : s);
    var out = "", last = 0, m;
    SAFE_TAG.lastIndex = 0;
    while ((m = SAFE_TAG.exec(s))) {
      out += escText(s.slice(last, m.index)) + m[0];
      last = SAFE_TAG.lastIndex;
    }
    return out + escText(s.slice(last));
  }

  function lsGet(k, dft) {
    try { var r = window.localStorage.getItem(k); return r === null ? dft : JSON.parse(r); }
    catch (e) { return dft; }
  }
  function lsSet(k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsRaw(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsPut(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  /* ---------------- 数据 ---------------- */
  var DATA = null;
  try { DATA = JSON.parse(byId("review-data").textContent); } catch (e) { DATA = null; }

  function formatBad() {
    var n = byId("notice");
    if (n) { n.hidden = false; }
  }

  var okData = DATA && DATA.version === 1 && Array.isArray(DATA.subjects) && DATA.subjects.length > 0;
  if (okData) {
    okData = DATA.subjects.every(function (s) {
      return s && typeof s.id === "string" && s.id && Array.isArray(s.knowledgePoints);
    });
  }
  if (!okData) { formatBad(); return; }

  var seenIds = {};
  DATA.subjects.forEach(function (s) {
    if (seenIds[s.id]) { console.warn("重复的科目 id：" + s.id); }
    seenIds[s.id] = true;
  });

  var SID = null;
  var filters = { level: "全部", form: "全部", source: "全部", signal: "全部" };

  function cur() {
    for (var i = 0; i < DATA.subjects.length; i++) {
      if (DATA.subjects[i].id === SID) return DATA.subjects[i];
    }
    return DATA.subjects[0];
  }
  function pts() { return cur().knowledgePoints || []; }
  function findPoint(id) {
    var list = pts();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function mkeyOf(sid, kid) { return MKEY + sid + ":" + kid; }
  // [sync] 读取一律走 v2 快照；旧散键只在写入时继续双写，作为降级备份
  function isDone(kid) {
    var e = entryOf(snap().mastery, SID, kid);
    return !!(e && e.on === 1);
  }
  function markDone(kid, on) {
    var s = snap(), t = nowMs();
    if (!s.mastery[SID]) s.mastery[SID] = {};
    s.mastery[SID][kid] = { on: on ? 1 : 0, t: t };
    commitSnap(t);
    // [sync] 降级备份：旧散键保持原语义（勾选写 "1"，取消删键）
    if (on) lsPut(mkeyOf(SID, kid), "1"); else lsDel(mkeyOf(SID, kid));
    syncMarkDirty();
  }
  function countDone(sub) {
    var m = snap().mastery[sub.id] || {}, c = 0, list = sub.knowledgePoints || [];
    for (var i = 0; i < list.length; i++) {
      var e = m[list[i].id];
      if (e && e.on === 1) c++;
    }
    return c;
  }


  /* 旧编号（A01…C10）→ 新编号迁移：知识点已按「章→节」重建，旧的「已掌握」勾选需要搬运
     B09/B10/C05/C06（高数）已超范围删除，旧勾选随条目作废，不再迁移 */
  var LS_MIGRATED_V3 = "review-migrated.v3";
  var OLD2NEW = {
  "new-university-chemistry": {
    "A01": ["c1s2-01"],
    "A02": ["c1s2-02"],
    "A03": ["c1s2-03"],
    "A04": ["c1s2-04"],
    "A05": ["c1s2-05"],
    "A06": ["c1s3-01"],
    "A07": ["c1s3-02","c1s4-02"],
    "A08": ["c1s3-02"],

  function migrateMasteryV3() {
    if (lsRaw(LS_MIGRATED_V3)) return 0;
    var moved = 0;
    Object.keys(OLD2NEW).forEach(function (sid) {
      var map = OLD2NEW[sid];
      Object.keys(map).forEach(function (old) {
        var key = MKEY + sid + ":" + old;
        if (lsRaw(key) !== "1") return;
        map[old].forEach(function (kid) {
          if (lsRaw(mkeyOf(sid, kid)) !== "1") lsPut(mkeyOf(sid, kid), "1");
        });
        lsDel(key);
        moved++;
      });
    });
    /* 已删除的旧条目（高数 B09/B10/C05/C06）不再有对应，清理残留的旧键 */
    var orphan = [];
    try {
      var L = window.localStorage;
      for (var i = 0; i < L.length; i++) {
        var kk = L.key(i);
        if (/^review-mastery:(new-university-chemistry|advanced-math):[ABC]\d{2}$/.test(kk)) orphan.push(kk);
      }
    } catch (e) {}
    orphan.forEach(function (kk) { lsDel(kk); });
    lsPut(LS_MIGRATED_V3, "1");
    return moved;
  }

  /* 旧版单科目存储迁移：review.mastered.v1 -> review-mastery:<sid>:<kid> */
  function migrateLegacy() {
    if (lsRaw(LS_MIGRATED)) return;
    var raw = lsRaw(LS_LEGACY);
    if (raw) {
      var map = {};
      try { map = JSON.parse(raw) || {}; } catch (e) { map = {}; }
      DATA.subjects.forEach(function (s) {
        (s.knowledgePoints || []).forEach(function (k) {
          if (!map[k.id]) return;
          var key = mkeyOf(s.id, k.id);
          if (lsRaw(key) === null) lsPut(key, "1");
        });
      });
    }
    lsPut(LS_MIGRATED, "1");
  }

  /* 首次打开默认第一个科目；新增科目后首次打开切到最新加入的；
     若某科目标了 defaultSubject:true，则在「没有历史选择」时优先它 */
  function defaultSubjectId() {
    for (var i = 0; i < DATA.subjects.length; i++) {
      if (DATA.subjects[i].defaultSubject === true) return DATA.subjects[i].id;
    }
    return DATA.subjects[0].id;
  }
  function pickSubject() {
    var seen = lsGet(LS_SEEN, null);
    var id;
    if (seen === null || !Array.isArray(seen)) {
      id = defaultSubjectId();
    } else {
      var unseen = DATA.subjects.filter(function (s) { return seen.indexOf(s.id) === -1; });
      if (unseen.length) {
        id = unseen[unseen.length - 1].id;
      } else {
        var last = lsGet(LS_ACTIVE, null);
        var hit = DATA.subjects.some(function (s) { return s.id === last; });
        id = hit ? last : defaultSubjectId();
      }
    }
    lsSet(LS_SEEN, DATA.subjects.map(function (s) { return s.id; }));
    return id;
  }

  /* [sync] ================= 存档快照 v2 · 数据层 ================= */
  // [sync] 进度以内存快照 SNAP 为准，localStorage 只做持久化；旧的散键继续双写当降级备份。
  // [sync] 结构：{ schema:2, deviceId, updatedAt, mastery:{sid:{kid:{on,t}}}, favs:{sid:{favKey:{on,t}}}, prefs:{theme} }
  var LS_SNAP = "review.sync.snapshot.v1";
  var LS_DEVICE = "review.sync.device.v1";
  var LS_SYNCCFG = "review.sync.cfg.v1";
  var LS_SYNCMETA = "review.sync.meta.v1";

  function nowMs() { return (new Date()).getTime(); }

  // [sync] deviceId 首次启动生成并固化，用来判断"这条改动是哪台设备写的"
  function uuid() {
    var s = "", i;
    try {
      if (window.crypto && window.crypto.getRandomValues) {
        var a = new Uint8Array(16);
        window.crypto.getRandomValues(a);
        a[6] = (a[6] & 15) | 64;
        a[8] = (a[8] & 63) | 128;
        for (i = 0; i < 16; i++) {
          if (i === 4 || i === 6 || i === 8 || i === 10) s += "-";
          s += (a[i] + 256).toString(16).slice(1);
        }
        return s;
      }
    } catch (e) {}
    var hex = "0123456789abcdef";
    for (i = 0; i < 32; i++) s += hex.charAt(Math.floor(Math.random() * 16));
    return s.slice(0, 8) + "-" + s.slice(8, 12) + "-4" + s.slice(13, 16) + "-a" + s.slice(17, 20) + "-" + s.slice(20, 32);
  }

  function guessDeviceName() {
    var ua = navigator.userAgent || "", os = "设备", br = "";
    if (/iPhone/.test(ua)) os = "iPhone";
    else if (/iPad/.test(ua)) os = "iPad";
    else if (/Android/.test(ua)) os = "Android";
    else if (/Windows/.test(ua)) os = "Windows";
    else if (/Mac OS X/.test(ua)) os = "Mac";
    else if (/Linux/.test(ua)) os = "Linux";
    if (/Edg\//.test(ua)) br = "Edge";
    else if (/Firefox\//.test(ua)) br = "Firefox";
    else if (/Chrome\//.test(ua)) br = "Chrome";
    else if (/Safari\//.test(ua)) br = "Safari";
    return br ? os + "-" + br : os;
  }

  function deviceInfo() {
    var d = lsGet(LS_DEVICE, null);
    if (d && typeof d === "object" && typeof d.id === "string" && d.id) {
      if (!d.name) d.name = guessDeviceName();
      return d;
    }
    d = { id: uuid(), name: guessDeviceName() };
    lsSet(LS_DEVICE, d);
    return d;
  }

  function validSnap(o) {
    return !!(o && typeof o === "object" &&
      o.schema === 2 &&
      typeof o.updatedAt === "number" && isFinite(o.updatedAt) &&
      o.mastery && typeof o.mastery === "object" && !Array.isArray(o.mastery) &&
      o.favs && typeof o.favs === "object" && !Array.isArray(o.favs) &&
      o.prefs && typeof o.prefs === "object" && !Array.isArray(o.prefs));

  function cloneSnap(o) { return JSON.parse(JSON.stringify(o)); }

    return { schema: 2, deviceId: deviceInfo().id, updatedAt: nowMs(), mastery: {}, favs: {}, prefs: {} };

  // [sync] 首次升级：把旧散键（review-mastery:* / review.favs.v1:* / review.theme.v1）收敛进 v2 快照。
  // 必须在 migrateLegacy() 与 migrateMasteryV3() 之后再跑，才能吃到它们刚搬好的状态。
  function snapFromLegacy() {
    var s = emptySnap(), t = nowMs();
    DATA.subjects.forEach(function (sub) {
      var m = {}, f = {}, sid = sub.id, i;
      (sub.knowledgePoints || []).forEach(function (k) {
        if (lsRaw(mkeyOf(sid, k.id)) === "1") m[k.id] = { on: 1, t: t };
      });
      if (Object.keys(m).length) s.mastery[sid] = m;
      var arr = lsGet(LS_FAV + sid, null);
      if (Array.isArray(arr)) {
        for (i = 0; i < arr.length; i++) {
          if (typeof arr[i] === "string") f[arr[i]] = { on: 1, t: t };
        }
      }
      if (Object.keys(f).length) s.favs[sid] = f;
    });
    var th = lsGet(LS_THEME, null);
    if (th === "dark" || th === "light") s.prefs.theme = th;
    return s;
  }

  function loadSnap() {
    var raw = lsRaw(LS_SNAP), o = null;
    if (raw) { try { o = JSON.parse(raw); } catch (e) { o = null; } }
    if (validSnap(o)) {
      if (o.deviceId) return o;
      o.deviceId = deviceInfo().id;
      lsSet(LS_SNAP, o);
      return o;
    }
    var built = snapFromLegacy();
    lsSet(LS_SNAP, built);
    return built;
  }
  // [sync] 懒加载：任何 isDone/favList 调用前都会拿到已初始化的快照
  function snap() { if (SNAP === null) SNAP = loadSnap(); return SNAP; }
  function commitSnap(t) {
    SNAP.updatedAt = t || nowMs();
    lsSet(LS_SNAP, SNAP);
  }

  /* [sync] ---------------- 合并算法：纯函数 ---------------- */
  // [sync] 规则：mastery/favs 逐条比 t 取大，t 相同则本地优先；prefs 整体取 updatedAt 较大一方；
  // [sync] 结果 updatedAt = max(local.updatedAt, remote.updatedAt)；绝不修改入参，一律返回新对象。
  function has0(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function normT(t) { return (typeof t === "number" && isFinite(t)) ? t : 0; }

  function pickEntry(a, b) {
    if (!a && !b) return null;
    if (!a) return { on: b.on === 1 ? 1 : 0, t: normT(b.t) };
    if (!b) return { on: a.on === 1 ? 1 : 0, t: normT(a.t) };
    return normT(a.t) >= normT(b.t)
      ? { on: a.on === 1 ? 1 : 0, t: normT(a.t) }   // 本地更新或同刻：本地优先
      : { on: b.on === 1 ? 1 : 0, t: normT(b.t) };
  }

  // [sync] 合并一层 {sid:{kid:{on,t}}}
  function mergeMap(L, R) {
    var out = {}, sids = {}, sid, kid, n, e;
    L = L || {}; R = R || {};
    for (sid in L) if (has0(L, sid)) sids[sid] = 1;
    for (sid in R) if (has0(R, sid)) sids[sid] = 1;
    for (sid in sids) if (has0(sids, sid)) {
      var lm = L[sid] || {}, rm = R[sid] || {}, kids = {}, m = {};
      for (kid in lm) if (has0(lm, kid)) kids[kid] = 1;
      for (kid in rm) if (has0(rm, kid)) kids[kid] = 1;
      n = 0;
      for (kid in kids) if (has0(kids, kid)) {
        e = pickEntry(lm[kid], rm[kid]);
        if (e) { m[kid] = e; n++; }
      }
      if (n) out[sid] = m;
    }
    return out;
  }

  function mergeSnapshot(local, remote) {
    if (!local && !remote) return null;
    if (!local) return cloneSnap(remote);
    if (!remote) return cloneSnap(local);
    var lt = normT(local.updatedAt), rt = normT(remote.updatedAt);
    var newer = lt >= rt ? local : remote;
    var out = {
      schema: 2,
      deviceId: local.deviceId || remote.deviceId || "",
      updatedAt: Math.max(lt, rt),
      mastery: mergeMap(local.mastery, remote.mastery),
      favs: mergeMap(local.favs, remote.favs),
      prefs: {}
    };
    var p = newer.prefs || {};
    for (var k in p) if (has0(p, k)) out.prefs[k] = p[k];
    return out;
  }

  // [sync] 结构级比较：只看进度内容，不看 deviceId 与 updatedAt，用来判断"合并结果是否需要回推"
  function countEntries(map) {
    var n = 0, sid, k;
    for (sid in map) if (has0(map, sid)) for (k in map[sid]) if (has0(map[sid], k)) n++;
    return n;
  }
  function sameProgress(a, b) {
    if (!a || !b) return false;
    var fields = ["mastery", "favs"], i, sid, kid, ea, eb;
    for (i = 0; i < 2; i++) {
      var A = a[fields[i]] || {}, B = b[fields[i]] || {};
      if (countEntries(A) !== countEntries(B)) return false;
      for (sid in A) if (has0(A, sid)) {
        var am = A[sid] || {}, bm = B[sid] || {};
        for (kid in am) if (has0(am, kid)) {
          ea = am[kid]; eb = bm[kid];
          if (!eb) return false;
          if ((ea.on === 1 ? 1 : 0) !== (eb.on === 1 ? 1 : 0)) return false;
          if (normT(ea.t) !== normT(eb.t)) return false;
        }
      }
    }
    return JSON.stringify(a.prefs || {}) === JSON.stringify(b.prefs || {});
  }

  /* [sync] ---------------- 同步通道适配层 ---------------- */
  // [sync] 契约：syncAdapter.pull() -> Promise<snapshot|null>，syncAdapter.push(snapshot) -> Promise<{snap,changed}>
  // [sync] 推送一律走「先读→合并→再写→回读校验」，从不盲目覆盖远端。
  var SYNC_FILE = "review-progress.json";
  var SYNC_TIMEOUT = 10000;

  function sErr(code, message, status) {
    var e = new Error(message || code);
    e.code = code || "error";
    e.status = status || 0;
    return e;
  }

  function syncCfg() {
    var c = lsGet(LS_SYNCCFG, null), d = { channel: "gist", gist: {}, webdav: {}, custom: {} };
    if (c && typeof c === "object") {
      if (c.channel === "gist" || c.channel === "webdav" || c.channel === "custom") d.channel = c.channel;
      ["gist", "webdav", "custom"].forEach(function (k) {
        if (c[k] && typeof c[k] === "object") d[k] = c[k];
      });
    }
    return d;
  }
  function saveSyncCfg(c) { lsSet(LS_SYNCCFG, c); }
  function syncMeta() {
    var m = lsGet(LS_SYNCMETA, null);
    return (m && typeof m === "object") ? m : {};
  }
  function saveSyncMeta(m) { lsSet(LS_SYNCMETA, m); }
  function syncTouched() {
    var m = syncMeta();
    m.touchedAt = nowMs();
    saveSyncMeta(m);
  }

  function basicAuth(user, pass) {
    var raw = (user || "") + ":" + (pass || "");
    try { return "Basic " + btoa(unescape(encodeURIComponent(raw))); }
    catch (e) { return "Basic " + btoa(raw); }
  }

  // [sync] 统一网络层：AbortController 10s 超时、状态码归一、JSON 安全解析
  function httpReq(url, opt) {
    return new Promise(function (resolve, reject) {
      if (typeof fetch !== "function") { reject(sErr("unsupported", "当前浏览器不支持 fetch，无法同步")); return; }
      var o = opt || {}, timer = null, finished = false, ctrl = null;
      try { ctrl = new AbortController(); } catch (e) { ctrl = null; }
      var init = { method: o.method || "GET", headers: o.headers || {}, cache: "no-store" };
      if (o.body !== undefined) init.body = o.body;
      if (ctrl) init.signal = ctrl.signal;
      timer = setTimeout(function () {
        if (finished) return;
        finished = true;
        try { if (ctrl) ctrl.abort(); } catch (e) {}
        reject(sErr("timeout", "请求超时（" + (SYNC_TIMEOUT / 1000) + " 秒）"));
      }, SYNC_TIMEOUT);
      function end(ok, val) {
        if (finished) return;
        finished = true;
        if (timer) clearTimeout(timer);
        if (ok) resolve(val); else reject(val);
      }
      fetch(url, init).then(function (res) {
        return res.text().then(function (txt) { return { res: res, txt: txt }; });
      }).then(function (r) {
        var body = null, kind = "none";
        if (r.txt) {
          try { body = JSON.parse(r.txt); kind = "json"; }
          catch (e) { body = null; kind = "text"; }
        }
        end(true, { status: r.res.status, ok: r.res.ok, body: body, text: r.txt, kind: kind });
      }).catch(function (err) {
        if (finished) return;
        var code = (err && err.name === "AbortError") ? "timeout" : "network";
        var msg = "网络错误：" + ((err && err.message) || "无法连接（跨域请求可能被浏览器阻止）");
        end(false, sErr(code, msg));
      });
    });
  }

  function classify(r, what) {
    if (r.status === 401 || r.status === 403) throw sErr("auth", "认证失败（HTTP " + r.status + "）：令牌或账号密码无效、或没有读写权限", r.status);
    if (r.status === 404) throw sErr("notfound", what + "不存在（HTTP 404）：请检查 ID 或地址", 404);
    if (r.status === 409) throw sErr("conflict", what + "版本冲突（HTTP 409）", 409);
    if (r.status === 429) throw sErr("ratelimit", what + "请求过于频繁（HTTP 429），请稍后再试", 429);
    if (r.status >= 400) throw sErr("http", what + "请求失败：HTTP " + r.status, r.status);
    return r;
  }

  // [sync] 通用驱动：先读→合并→再写→回读校验，最多 3 轮（自愈，避免与他端并发互相覆盖）
  function adapterDriver(ad, local) {
    var rounds = 0;
    function round(cur) {
      rounds++;
      return ad.get().then(function (remote) {
        var merged = remote ? mergeSnapshot(cur, remote) : cloneSnap(cur);
        if (!merged.deviceId) merged.deviceId = deviceInfo().id;
        var changed = !remote || !sameProgress(merged, remote) || normT(merged.updatedAt) > normT(remote.updatedAt);
        if (!changed) return { snap: merged, changed: false, rounds: rounds, remote: remote };
        return ad.put(merged).then(function () {
          return ad.get();
        }).then(function (back) {
          if (back && sameProgress(merged, back)) return { snap: merged, changed: true, rounds: rounds, remote: back };
          if (rounds < 3) return round(back ? mergeSnapshot(merged, back) : merged);
          throw sErr("verify", "推送后回读校验不一致：远端可能被其他设备同时改写，请稍后重试");
        });
      });
    }
    return round(cloneSnap(local));
  }

  function gistFileOf(body) {
    var f = body && body.files && body.files[SYNC_FILE];
    return (f && typeof f.content === "string") ? f.content : null;
  }
  function parseRemoteSnap(txt) {
    if (!txt) return null;
    var o = null;
    try { o = JSON.parse(txt); }
    catch (e) { throw sErr("parse", "远端 " + SYNC_FILE + " 不是合法 JSON，已停止写入以免覆盖"); }
    if (!validSnap(o)) throw sErr("parse", "远端快照结构不合法（schema 必须为 2），已停止写入以免覆盖");
    return o;
  }

  // [sync] A) GitHub Gist：PAT + Gist ID；内容写 review-progress.json 字段
  function gistAdapter(cfg) {
    var g = cfg.gist || {};
    var base = g.apiBase || "https://api.github.com";  // [sync] 仅测试/自建代理时才改
    var api = base.replace(/\/+$/, "") + "/gists/" + encodeURIComponent(g.id || "");
    function hdr() {
      return {
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
        "Authorization": "token " + (g.token || "")
      };
    }
    return {
      name: "GitHub Gist",
      configured: function () { return !!(g.id && g.token); },
      get: function () {
        return httpReq(api, { method: "GET", headers: hdr() }).then(function (r) {
          classify(r, "Gist ");
          return parseRemoteSnap(gistFileOf(r.body));
        });
      },
      put: function (snapObj) {
        var payload = { files: {} };
        payload.files[SYNC_FILE] = { content: JSON.stringify(snapObj, null, 2) };
        return httpReq(api, { method: "PATCH", headers: hdr(), body: JSON.stringify(payload) }).then(function (r) {
          classify(r, "Gist ");
          return r;
        });
      }
    };
  }

  // [sync] B) WebDAV：PUT/GET 一个 .json，Basic Auth，兼容坚果云 / Nextcloud
  function webdavAdapter(cfg) {
    var w = cfg.webdav || {};
    var url = w.url || "";
    function hdr() {
      var h = { "Content-Type": "application/json" };
      if (w.user || w.pass) h["Authorization"] = basicAuth(w.user, w.pass);
      return h;
    }
    return {
      name: "WebDAV",
      configured: function () { return !!url; },
      get: function () {
        return httpReq(url, { method: "GET", headers: hdr() }).then(function (r) {
          if (r.status === 404) return null;  // 文件还没建，视为空远端
          classify(r, "WebDAV 文件");
          return parseRemoteSnap(r.text);
        });
      },
      put: function (snapObj) {
        return httpReq(url, { method: "PUT", headers: hdr(), body: JSON.stringify(snapObj, null, 2) }).then(function (r) {
          classify(r, "WebDAV 文件");
          return r;
        });
      }
    };
  }

  // [sync] C) 自定义端点（可自建 Cloudflare Worker / Vercel Function）
  // [sync] 协议：GET <url> 返回快照 JSON（内容为空或 404 表示远端还没有存档）；
  // [sync]       PUT <url> 提交快照 JSON（请求体即快照本身，Content-Type: application/json）。
  // [sync]       响应需带 Access-Control-Allow-Origin，并允许 GET, PUT, Content-Type 预检。
  function customAdapter(cfg) {
    var c = cfg.custom || {};
    var url = c.url || "";
    function hdr() {
      var h = { "Content-Type": "application/json" };
      if (c.token) h["Authorization"] = "Bearer " + c.token;
      return h;
    }
    return {
      name: "自定义端点",
      configured: function () { return !!url; },
      get: function () {
        return httpReq(url, { method: "GET", headers: hdr() }).then(function (r) {
          if (r.status === 404) return null;
          classify(r, "自定义端点");
          return parseRemoteSnap(r.text);
        });
      },
      put: function (snapObj) {
        return httpReq(url, { method: "PUT", headers: hdr(), body: JSON.stringify(snapObj, null, 2) }).then(function (r) {
          classify(r, "自定义端点");
          return r;
        });
      }
    };
  }

  function buildAdapter() {
    var cfg = syncCfg();
    if (cfg.channel === "gist") return gistAdapter(cfg);
    if (cfg.channel === "webdav") return webdavAdapter(cfg);
    if (cfg.channel === "custom") return customAdapter(cfg);
    return null;
  }

  // [sync] 对外的 syncAdapter：未配置时返回 null，调用方据此保持"完全离线"
  function syncAdapter() {
    var ad = buildAdapter();
    if (!ad || !ad.configured()) return null;
    return {
      name: ad.name,
      pull: function () { return ad.get(); },
      push: function (local) { return adapterDriver(ad, local); }
    };
  }

  /* ---------------- 公式渲染 ---------------- */
  /* 纯文本化：给 aria-label / title 用，避免把 \(...\) 分隔符和反斜杠命令念出来 */
  function plainLabel(s) {
    return String(s == null ? "" : s)
      .replace(/\\\(|\\\)|\\\[|\\\]/g, "")
      .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "$1/$2")
      .replace(/\\(?:to|rightarrow)\b/g, "→")
      .replace(/\\infty\b/g, "∞")
      .replace(/\\(?:cdot|times)\b/g, "×")
      .replace(/\\(?:le|leq)\b/g, "≤")
      .replace(/\\(?:ge|geq)\b/g, "≥")
      .replace(/\\(?:sim|approx)\b/g, "≈")
      .replace(/\\neq\b/g, "≠")
      .replace(/\\(?:sin|cos|tan|ln|lg|log|lim|max|min|int|sum|sqrt)\b/g, function (m) { return m.slice(1); })
      .replace(/\\[a-zA-Z]+/g, "")
      .replace(/[{}]/g, "");
  }

  function stripMathMarkers(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var list = [], n;
    while ((n = walker.nextNode())) {
      if (n.nodeValue && /\\[()[\]]/.test(n.nodeValue)) list.push(n);
    }
    for (var i = 0; i < list.length; i++) {
      list[i].nodeValue = list[i].nodeValue.replace(/\\\(|\\\)|\\\[|\\\]/g, "");
    }
  }

  function renderMath(root) {
    var target = root || document.body;
    if (!target) return;
    if (typeof window.renderMathInElement === "function") {
      try {
        window.renderMathInElement(target, {
          delimiters: [
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false,
          strict: false,
          ignoredClasses: ["katex", "katex-display"]
        });
      } catch (e) { if (window.console) window.console.warn("公式渲染失败：", e); }
      return;
    }
    stripMathMarkers(target);
  }
  window.renderMath = renderMath;

  /* [update] ================= 应用更新检查（2.5.0 新增） ================= */
  var LS_UPDCFG = "review.update.cfg.v1";
  var LS_UPDIGN = "review.update.ignore.v1";
  var UPD_TIMEOUT = 8000;

  var UPDATE = {
    status: "idle",            // idle | checking | found | none | error
    remote: null,              // 远端信息 {version,url,notes,date}：只在确有新版本时保留
    latest: "",                // 远端版本号（检查成功即记录，新旧都记）
    error: "",
    checkedAt: 0,
    deferred: false            // 本次会话点过「稍后」
  };
  var updBar = byId("updatebar");
  var updSectionEl = null;

  function updateCfg() {
    var c = lsGet(LS_UPDCFG, null), d = { url: "", auto: true };
    if (c && typeof c === "object") {
      if (typeof c.url === "string") d.url = c.url;
      if (typeof c.auto === "boolean") d.auto = c.auto;
    }
    return d;
  }
  function saveUpdateCfg(c) {
    var o = c || {};
    lsSet(LS_UPDCFG, { url: String(o.url == null ? "" : o.url).trim(), auto: o.auto !== false });
  }

  function ignoredVersions() {
    var a = lsGet(LS_UPDIGN, null);
    if (!Array.isArray(a)) return [];
    return a.filter(function (v) { return typeof v === "string" && !!v; });
  }
  function isIgnored(v) { return !!v && ignoredVersions().indexOf(v) !== -1; }
  function ignoreVersion(v) {
    if (!v) return;
    var a = ignoredVersions();
    if (a.indexOf(v) === -1) { a.push(v); lsSet(LS_UPDIGN, a.slice(-20)); }
  }
  function unignoreVersion(v) {
    var a = ignoredVersions(), i = a.indexOf(v);
    if (i === -1) return;
    a.splice(i, 1);
    lsSet(LS_UPDIGN, a);
  }

  // 语义化版本：逐段比较数字，忽略前后空格、前缀 v、-pre 与 +build 后缀
  function parseVer(v) {
    if (typeof v !== "string") return null;
    var t = v.trim().replace(/^v/i, "").split("+")[0].split("-")[0];
    if (!/^\d+(\.\d+)*$/.test(t)) return null;
    return t.split(".").map(function (n) { return parseInt(n, 10) || 0; });
  }
  function cmpVersion(a, b) {
    var x = parseVer(a), y = parseVer(b);
    if (!x || !y) return 0;   // 解析失败按「不更新」处理（等价于相同版本）
    var n = Math.max(x.length, y.length);
    for (var i = 0; i < n; i++) {
      var p = x[i] || 0, q = y[i] || 0;
      if (p > q) return 1;
      if (p < q) return -1;
    }
    return 0;
  }

  // 只放行 http/https，挡掉 javascript: data: 等
  function validHttpUrl(u) {
    if (typeof u !== "string") return "";
    var s = u.trim();
    if (!/^https?:\/\/[^\s]+$/i.test(s)) return "";
    try {
      var o = new URL(s);
      if (o.protocol !== "http:" && o.protocol !== "https:") return "";
      return s;
    } catch (e) { return ""; }
  }

  // 更新检查专用网络层：cache:no-store + 8 秒超时；失败只抛可读错误
  function updFetch(url) {
    return new Promise(function (resolve, reject) {
      if (typeof fetch !== "function") { reject(new Error("当前浏览器不支持 fetch")); return; }
      var timer = null, done = false, ctrl = null;
      try { ctrl = new AbortController(); } catch (e) { ctrl = null; }
      var init = { method: "GET", cache: "no-store" };
      if (ctrl) init.signal = ctrl.signal;
      timer = setTimeout(function () {
        if (done) return;
        done = true;
        try { if (ctrl) ctrl.abort(); } catch (e) {}
        reject(new Error("请求超时（" + (UPD_TIMEOUT / 1000) + " 秒）"));
      }, UPD_TIMEOUT);
      fetch(url, init).then(function (res) {
        return res.text().then(function (raw) { return { res: res, raw: raw }; });
      }).then(function (r) {
        if (done) return;
        done = true;
        if (timer) clearTimeout(timer);
        if (r.res && r.res.ok === false) { reject(new Error("更新源返回 HTTP " + r.res.status)); return; }
        var body = null;
        try { body = JSON.parse(r.raw); }
        catch (e) { reject(new Error("更新源返回的不是合法 JSON")); return; }
        resolve({ body: body, text: r.raw, status: r.res.status });
      }).catch(function (err) {
        if (done) return;
        done = true;
        if (timer) clearTimeout(timer);
        reject(new Error("网络错误：" + ((err && err.message) || "无法连接（跨域可能被浏览器阻止）")));
      });
    });
  }

  // 手动 / 自动检查；失败静默，只把原因写进抽屉状态行
  function checkUpdate(manual) {
    var cfg = updateCfg();
    var src = validHttpUrl(cfg.url);
    if (!src) {
      UPDATE.status = "error";
      UPDATE.error = cfg.url ? "更新地址不合法（只允许 http/https）" : "尚未配置更新检查地址";
      UPDATE.remote = null;
      UPDATE.latest = "";
      UPDATE.checkedAt = nowMs();
      refreshUpdateBar();
      syncUpdateUI();
      if (manual) toastSync(UPDATE.error);
      return;
    }
    if (UPDATE.status === "checking") return;
    UPDATE.status = "checking";
    UPDATE.error = "";
    refreshUpdateBar();
    syncUpdateUI();
    updFetch(src).then(function (r) {
      var body = r && r.body;
      if (!body || typeof body !== "object" || Array.isArray(body)) throw new Error("更新源 JSON 结构不合法");
      var ver = typeof body.version === "string" ? body.version.trim()
        : (typeof body.version === "number" ? String(body.version) : "");
      if (!parseVer(ver)) throw new Error("更新源 version 字段缺失或不是 x.y.z");
      var url = validHttpUrl(body.url);
      if (!url) throw new Error("更新源 url 字段缺失或不是 http(s) 地址");
      var info = {
        version: ver,
        url: url,
        notes: typeof body.notes === "string" ? body.notes : "",
        date: typeof body.date === "string" ? body.date.trim() : ""
      };
      UPDATE.latest = ver;
      UPDATE.checkedAt = nowMs();
      UPDATE.deferred = false;
      if (cmpVersion(ver, APP_VERSION) > 0) {
        UPDATE.status = "found";
        UPDATE.remote = info;
      } else {
        UPDATE.status = "none";
        UPDATE.remote = null;
      }
      refreshUpdateBar();
      syncUpdateUI();
    }).catch(function (err) {
      UPDATE.status = "error";
      UPDATE.error = (err && err.message) || "检查失败";
      UPDATE.remote = null;
      UPDATE.checkedAt = nowMs();
      refreshUpdateBar();
      syncUpdateUI();
    });
  }

  function clipLine(v, n) {
    var t = String(v == null ? "" : v).replace(/\s+/g, " ").trim();
    if (!t) return "";
    return t.length > n ? t.slice(0, n) + "…" : t;
  }

  function updStatusText() {
    var at = UPDATE.checkedAt ? "（" + fmtTime(UPDATE.checkedAt) + "）" : "";
    var st = UPDATE.status, r = UPDATE.remote;
    if (st === "checking") return "正在检查更新…";
    if (st === "found" && r) {
      return "发现新版本 v" + r.version + (r.date ? " · " + r.date : "") + at +
        (isIgnored(r.version) ? "；该版本已忽略，不再自动弹横幅" : "");
    }
    if (st === "none") return "已是最新版本（本机 v" + APP_VERSION + (UPDATE.latest ? " / 远端 v" + UPDATE.latest : "") + "）" + at;
    if (st === "error") return "检查失败：" + UPDATE.error + at;
    return "尚未检查" + (updateCfg().url ? "" : "（先填写更新地址）");
  }

  // 抽屉里的更新块状态变化：只重建这一块，其余同步表单不动
  function syncUpdateUI() {
    // 注意：renderUpdateSection() 会把模块变量 updSectionEl 指向新节点，
    // 所以必须先抓住旧节点与它的父节点，再重建替换，否则 parentNode 会变成 null。
    var old = updSectionEl;
    if (!old || !old.parentNode) return;
    var parent = old.parentNode;
    var fresh = renderUpdateSection();
    parent.replaceChild(fresh, old);
  }

  // 横幅只在「确有新版本 + 本次未点稍后 + 该版本未被忽略」时出现
  function refreshUpdateBar() {
    if (!updBar) return;
    var r = UPDATE.remote;
    var show = UPDATE.status === "found" && !!r && !UPDATE.deferred && !isIgnored(r.version);
    if (!show) { updBar.hidden = true; return; }
    var ver = byId("ubVer"), notes = byId("ubNotes");
    if (ver) ver.textContent = "发现新版本 v" + r.version + (r.date ? "（" + r.date + "）" : "");
    if (notes) {
      notes.textContent = r.notes ? clipLine(r.notes, 64) : ("本机 v" + APP_VERSION + " → 远端 v" + r.version);
      notes.title = r.notes || "";
    }
    updBar.hidden = false;
  }

  function fileNameOf(u) {
    var path = String(u || "").split("#")[0].split("?")[0];
    var parts = path.split("/"), last = parts[parts.length - 1] || "";
    try { last = decodeURIComponent(last); } catch (e) {}
    if (!last || last.indexOf(".") === -1) last = "review.html";
    return last.replace(/[\\/:*?"<>|\s]+/g, "_");
  }

  // 「立即更新」：http(s) 直接跳转新地址（附 ?v= 防缓存）；file:// 浏览器不允许覆盖本地文件 → 降级为下载
  function doUpdate() {
    var r = UPDATE.remote;
    if (!r) { toastSync("没有可用的更新信息，请先检查更新"); return; }
    var url = validHttpUrl(r.url);
    if (!url) { toastSync("更新地址不合法，已阻止跳转"); return; }
    var sep = url.indexOf("?") === -1 ? "?" : "&";
    var target = url + sep + "v=" + encodeURIComponent(r.version);
    var proto = (window.location && window.location.protocol) || "";
    if (proto === "http:" || proto === "https:") {
      try { window.location.href = target; return; } catch (e) {}
    }
    var a = el("a");
    a.href = url;
    a.setAttribute("download", fileNameOf(url));
    a.setAttribute("rel", "noopener");
    a.setAttribute("target", "_blank");
    a.style.display = "none";
    document.body.appendChild(a);
    try { a.click(); } catch (e) { try { window.open(url, "_blank"); } catch (e2) {} }
    setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 0);
    toastSync("已开始下载新版本：请用新文件替换本地旧文件（同名覆盖即可）。掌握进度与收藏保存在浏览器本地，替换文件不会丢失。", 7000);
  }

  function renderUpdateSection() {
    var box = el("div", "supd");
    box.appendChild(txt("h3", "supdTitle", "应用更新"));
    var cfg = updateCfg();

    var f = el("div", "sfield");
    var lab = txt("label", "", "更新检查地址（可选，返回 JSON 的 URL）");
    lab.setAttribute("for", "sf-update-url");
    var inp = el("input");
    inp.id = "sf-update-url";
    inp.type = "url";
    inp.setAttribute("data-u", "url");
    inp.setAttribute("inputmode", "url");
    inp.value = cfg.url || "";
    inp.placeholder = "https://example.com/review-update.json";
    inp.autocomplete = "off";
    inp.spellcheck = false;
    inp.addEventListener("change", function () {
      var c = updateCfg();
      c.url = inp.value;
      saveUpdateCfg(c);
      UPDATE.status = "idle";
      UPDATE.remote = null;
      UPDATE.latest = "";
      UPDATE.checkedAt = 0;
      refreshUpdateBar();
      syncUpdateUI();
    });
    f.appendChild(lab);
    f.appendChild(inp);
    box.appendChild(f);

    var chk = el("label", "supdCheck");
    chk.setAttribute("for", "sf-update-auto");
    var cb = el("input");
    cb.type = "checkbox";
    cb.id = "sf-update-auto";
    cb.setAttribute("data-u", "auto");
    cb.checked = cfg.auto !== false;
    cb.addEventListener("change", function () {
      var c = updateCfg();
      c.auto = !!cb.checked;
      saveUpdateCfg(c);
    });
    chk.appendChild(cb);
    chk.appendChild(document.createTextNode("打开页面时自动检查更新"));
    box.appendChild(chk);

    var row = el("div", "srow");
    var btn = txt("button", "btn small", "立即检查");
    btn.type = "button";
    btn.addEventListener("click", function () {
      var c = updateCfg();
      c.url = inp.value;
      saveUpdateCfg(c);
      UPDATE.deferred = false;
      checkUpdate(true);
    });
    row.appendChild(btn);
    if (UPDATE.status === "found" && UPDATE.remote) {
      var rv = UPDATE.remote.version;
      var go = txt("button", "btn small", "立即更新");
      go.type = "button";
      go.addEventListener("click", function () { doUpdate(); });
      row.appendChild(go);
      var ig = txt("button", "btn small", isIgnored(rv) ? "取消忽略" : ("忽略 v" + rv));
      ig.type = "button";
      ig.addEventListener("click", function () {
        var was = isIgnored(rv);
        if (was) unignoreVersion(rv); else ignoreVersion(rv);
        if (!was) UPDATE.deferred = true;
        refreshUpdateBar();
        syncUpdateUI();
        toastSync(was ? ("已取消忽略 v" + rv) : ("已忽略 v" + rv + "，不再自动提示该版本"));
      });
      row.appendChild(ig);
    }
    box.appendChild(row);

    var stat = el("div", "sstat");
    stat.appendChild(document.createTextNode(updStatusText()));
    box.appendChild(stat);

    var json = el("p", "supdJson");
    json.textContent = '{ "version": "2.6.0", "url": "https://…/review.html", "notes": "本次更新说明", "date": "2026-10-23" }';
    box.appendChild(json);
    box.appendChild(snote("只接受 http/https 地址；版本按 x.y.z 逐段比较，远端高于本机 v" + APP_VERSION + " 才提示。检查失败不会影响离线使用。"));
    box.appendChild(snote("掌握进度与收藏保存在浏览器本地，替换 HTML 文件不会丢失；手机端把新文件存到同一位置覆盖旧文件即可。"));

    updSectionEl = box;
    return box;
  }

  (function wireUpdateBanner() {
    var go = byId("ubGo"), later = byId("ubLater"), ign = byId("ubIgnore");
    if (go) go.addEventListener("click", function () { doUpdate(); });
    if (later) later.addEventListener("click", function () {
      UPDATE.deferred = true;
      refreshUpdateBar();
      toastSync("本次不再提示；仍可在「同步 → 应用更新」里手动检查");
    });
    if (ign) ign.addEventListener("click", function () {
      var r = UPDATE.remote;
      if (r) ignoreVersion(r.version);
      refreshUpdateBar();
      syncUpdateUI();
      toastSync(r ? ("已忽略 v" + r.version + "，不再提示该版本") : "已忽略");
    });
    // 检查时机：首屏 3 秒后自动检查一次（已配置且开关打开），之后每次打开页面各一次，不做轮询
    setTimeout(function () {
      var cfg = updateCfg();
      if (cfg.auto !== false && validHttpUrl(cfg.url)) checkUpdate(false);
    }, 3000);
  })();

  /* [sync] ---------------- 同步引擎：触发、合并落地、退避重试 ---------------- */
  var SYNC_BUSY = false;                    // [sync] in-flight 标志：同时只允许一个同步任务
  var SYNC_DEBOUNCE = null;                 // [sync] 改动后 3s 防抖推送
  var SYNC_RETRY_TIMER = null;
  var SYNC_RETRY_WAITS = [3000, 10000, 30000];  // [sync] 失败退避：3s / 10s / 30s，最多 3 次

  function syncSetMeta(patch) {
    var m = syncMeta();
    for (var k in patch) if (has0(patch, k)) m[k] = patch[k];
    saveSyncMeta(m);
    return m;
  }

  // [sync] 远端快照落地：合并进本地并刷新界面（主题、勾选、收藏、统计一起走）
  function applyRemote(remote) {
    if (!remote) return false;
    var before = snap();
    var merged = mergeSnapshot(before, remote);
    if (!sameProgress(merged, before)) {
      SNAP = merged;
      commitSnap(merged.updatedAt);
      afterRemoteApply();
      return true;
    }
    if (normT(merged.updatedAt) > normT(before.updatedAt)) commitSnap(merged.updatedAt);
    return false;
  }

  function afterRemoteApply() {
    var s = snap(), th = s.prefs.theme;
    if (th === "dark" || th === "light") applyTheme(th);
    renderAll();
    if (!favDrawer.hidden) renderFavDrawer();
    if (syncDrawer && !syncDrawer.hidden) renderSyncStat();
  }

  function doPull(ad) {
    return ad.pull().then(function (remote) {
      var changed = applyRemote(remote);
      // [sync] 合并后若与远端仍有差异（本地多出条目），立即补一次推送
      var needPush = !!remote && !sameProgress(snap(), remote);
      return {
        changed: changed,
        needPush: needPush,
        remoteCount: { mastery: countEntries((remote && remote.mastery) || {}), favs: countEntries((remote && remote.favs) || {}) }
      };
    });
  }

  function doPush(ad) {
    return ad.push(snap()).then(function (r) {
      if (r && r.snap) {
        SNAP = r.snap;
        commitSnap(r.snap.updatedAt);
      }
      return {
        remoteCount: { mastery: countEntries(snap().mastery), favs: countEntries(snap().favs) },
        changed: !!(r && r.changed)
      };
    });
  }

  // [sync] 统一入口：mode = full（先拉→合并→再推）/ pull / push
  function syncNow(mode, attempt) {
    mode = mode || "full";
    var ad = syncAdapter();
    if (!ad) { setSyncState("", "未配置"); refreshSyncDot(); toastSync("还没配置同步通道"); return Promise.resolve(false); }
    if (SYNC_BUSY) { toastSync("同步进行中，请稍候"); return Promise.resolve(false); }
    SYNC_BUSY = true;
    if (SYNC_RETRY_TIMER) { clearTimeout(SYNC_RETRY_TIMER); SYNC_RETRY_TIMER = null; }
    if (SYNC_DEBOUNCE) { clearTimeout(SYNC_DEBOUNCE); SYNC_DEBOUNCE = null; }
    setSyncState("busy", "同步中");
    renderSyncStat();

    var chain;
    if (mode === "pull") chain = doPull(ad);
    else if (mode === "push") chain = doPush(ad);
    else chain = doPull(ad).then(function (r) {
      if (r.changed || r.needPush) return doPush(ad);
      return r;
    });

    return chain.then(function (res) {
      SYNC_BUSY = false;
      var patch = { lastSyncAt: nowMs(), lastError: "", pending: false };
      if (res && res.remoteCount) patch.remoteCount = res.remoteCount;
      syncSetMeta(patch);
      refreshSyncDot();
      renderSyncStat();
      return true;
    }).catch(function (err) {
      SYNC_BUSY = false;
      var msg = (err && err.message) || "同步失败";
      syncSetMeta({ lastError: msg, pending: true });
      refreshSyncDot();
      renderSyncStat();
      toastSync("同步失败：" + msg);
      if (mode !== "pull" && (attempt || 0) < SYNC_RETRY_WAITS.length) {
        if (SYNC_RETRY_TIMER) clearTimeout(SYNC_RETRY_TIMER);
        SYNC_RETRY_TIMER = setTimeout(function () {
          SYNC_RETRY_TIMER = null;
          if (!syncAdapter()) return;
          syncNow("push", (attempt || 0) + 1);
        }, SYNC_RETRY_WAITS[attempt || 0]);
      }
      return false;
    });
  }

  // [sync] 本地改动入口：由 markDone / setFav / 主题切换调用
  function syncMarkDirty() {
    syncTouched();
    if (!syncAdapter()) { refreshSyncDot(); return; }
    syncSetMeta({ pending: true });
    refreshSyncDot();
    if (SYNC_DEBOUNCE) clearTimeout(SYNC_DEBOUNCE);
    SYNC_DEBOUNCE = setTimeout(function () {
      SYNC_DEBOUNCE = null;
      if (!syncAdapter()) return;
      syncNow("push");
    }, 3000);
  }

  // [sync] 3.6 导入导出兜底
  function exportSnapFile() {
    var s = cloneSnap(snap());
    var name = "review-progress-" + String(deviceInfo().name || "device").replace(/[^\w\-]+/g, "_") +
      "-" + (new Date()).toISOString().slice(0, 10) + ".json";
    var url = null;
    try { url = URL.createObjectURL(new Blob([JSON.stringify(s, null, 2)], { type: "application/json" })); }
    catch (e) { url = null; }
    if (!url) { toastSync("导出失败：当前浏览器不支持本地文件导出"); return; }
    var a = el("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      try { URL.revokeObjectURL(url); } catch (e) {}
    }, 600);
    toastSync("已导出进度存档：" + name);
  }

  function importSnapFile(file) {
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { toastSync("导入失败：文件超过 4MB"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var o = null;
      try { o = JSON.parse(String(reader.result)); }
      catch (e) { toastSync("导入失败：文件不是合法 JSON，本地进度未变"); return; }
      if (!validSnap(o)) { toastSync("导入失败：不是 v2 进度快照（缺 schema/mastery/favs），本地进度未变"); return; }
      var merged = mergeSnapshot(snap(), o);
      SNAP = merged;
      commitSnap(merged.updatedAt);
      afterRemoteApply();
      if (syncAdapter()) syncMarkDirty();
      renderSyncStat();
      toastSync("导入完成：合并后共 " + countEntries(merged.mastery) + " 条掌握、" + countEntries(merged.favs) + " 条收藏");
    };
    reader.onerror = function () { toastSync("导入失败：读取文件出错，本地进度未变"); };
    reader.readAsText(file);
  }

  function clearSyncCfg() {
    lsDel(LS_SYNCCFG);
    lsDel(LS_SYNCMETA);
    if (SYNC_RETRY_TIMER) { clearTimeout(SYNC_RETRY_TIMER); SYNC_RETRY_TIMER = null; }
    if (SYNC_DEBOUNCE) { clearTimeout(SYNC_DEBOUNCE); SYNC_DEBOUNCE = null; }
    renderSyncDrawer();
    refreshSyncDot();
    toastSync("已清除同步配置（进度本身保留）");
  }

  syncBtn.addEventListener("click", function () {
    if (syncDrawer.hidden) openSync(); else closeSync();
  });
  byId("syncClose").addEventListener("click", function () { closeSync(); });
  syncScrim.addEventListener("click", function () { closeSync(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && syncDrawer && !syncDrawer.hidden) closeSync();
  });
  // [sync] 触发时机 3：切到后台/锁屏前立即推送
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && syncAdapter()) syncNow("push");
  });
  // [sync] 触发时机 1：首屏渲染完成后 1.5s 拉一次（不阻塞加载）
  setTimeout(function () {
    if (!syncAdapter()) { refreshSyncDot(); return; }
    var meta = syncMeta();
    syncNow(meta.pending ? "push" : "full");
  }, 1500);

  /* ---------------- 启动 ---------------- */
  try {
    migrateLegacy();
    var movedV3 = migrateMasteryV3();
    // [sync] 两次旧键迁移跑完，再把结果收敛进 v2 快照（首次升级只发生一次）
    snap();
    SID = pickSubject();
    lsSet(LS_ACTIVE, SID);
    applyTheme(lsGet(LS_THEME, null));
    renderAll();

    if (movedV3) {
      var tst = byId("toast");
      if (tst) {
        tst.textContent = "已把 " + movedV3 + " 条旧的「已掌握」勾选迁移到新知识点";
        setTimeout(function () { tst.classList.add("show"); }, 250);
        setTimeout(function () { tst.classList.remove("show"); tst.classList.add("out"); }, 3600);
      }
    }

    if (!lsGet(LS_HINT, false)) {
      var toast = byId("toast");
      setTimeout(function () { toast.classList.add("show"); }, 250);
      setTimeout(function () {
        toast.classList.remove("show");
        toast.classList.add("out");
      }, 3200);
      lsSet(LS_HINT, true);
    }
  } catch (err) {
    formatBad();
    if (window.console) console.error(err);
  }
  // [sync] 调试出口：仅供自动化测试读取内部状态，不参与任何业务逻辑
  window.__reviewSync = {
    snap: snap, commitSnap: commitSnap, mergeSnapshot: mergeSnapshot, sameProgress: sameProgress,
    emptySnap: emptySnap, validSnap: validSnap, loadSnap: loadSnap, LS_SNAP: LS_SNAP,
    syncAdapter: syncAdapter, adapterDriver: adapterDriver, syncCfg: syncCfg, saveSyncCfg: saveSyncCfg,
    syncMeta: syncMeta, saveSyncMeta: saveSyncMeta, httpReq: httpReq, gistAdapter: gistAdapter,
    webdavAdapter: webdavAdapter, customAdapter: customAdapter, classify: classify,
    syncNow: syncNow, syncMarkDirty: syncMarkDirty, exportSnapFile: exportSnapFile,
    importSnapFile: importSnapFile, countEntries: countEntries, deviceInfo: deviceInfo,
    syncTouched: syncTouched, toastSync: toastSync
  };
  // [update] 调试出口：仅供自动化测试读取更新模块内部状态，不参与业务逻辑
  window.__reviewUpdate = {
    UPDATE: UPDATE, updateCfg: updateCfg, saveUpdateCfg: saveUpdateCfg, checkUpdate: checkUpdate,
    cmpVersion: cmpVersion, parseVer: parseVer, validHttpUrl: validHttpUrl, updFetch: updFetch,
    doUpdate: doUpdate, ignoreVersion: ignoreVersion, unignoreVersion: unignoreVersion, isIgnored: isIgnored,
    ignoredVersions: ignoredVersions, refreshUpdateBar: refreshUpdateBar, renderUpdateSection: renderUpdateSection,
    updStatusText: updStatusText, fileNameOf: fileNameOf, LS_UPDCFG: LS_UPDCFG, LS_UPDIGN: LS_UPDIGN
  };
})();
</script>
</body>
</html>
